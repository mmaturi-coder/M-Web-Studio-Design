# Pubblica PAWAY su branch gh-pages (link pubblico senza Terminale sul Mac).
name: Publish PAWAY to gh-pages

on:
  push:
    branches: [cursor/paway-presentazione-3f56]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paway-gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish site to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
          clean: true
          exclude_assets: .github
